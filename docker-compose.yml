version: "3.9"

services:
  odoo:
    build: .
    container_name: "odoo_app"
    # 1. Enable proxy mode and hide the database list
    # command: odoo --proxy-mode --no-database-list --db-filter=^%d$$
    command: odoo --proxy-mode
    depends_on:
      db: 
        condition: "service_healthy"
    ports:
      - "8069:8069"
    volumes:
      - "odoo-data:/var/lib/odoo"
      - ./addons:/mnt/extra-addons
    environment:
      - "HOST=db"
      - "USER=odoo"
      - "PASSWORD_FILE=/run/secrets/postgresql_password"
      # ODOO_DBFILTER with escaped dollar sign
      #- "ODOO_DBFILTER=^%d$$"
    secrets:
      - "postgresql_password"
    networks:
      - "odoo-net"
    restart: "unless-stopped"

  db:
    image: "postgres:16"
    container_name: "odoo_db"
    environment:
      - "POSTGRES_DB=postgres"
      - "POSTGRES_USER=odoo"
      - "POSTGRES_PASSWORD_FILE=/run/secrets/postgresql_password"
    volumes:
      - "db-data:/var/lib/postgresql/data"
    secrets:
      - "postgresql_password"
    networks:
      - "odoo-net"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: "10s"
      timeout: "5s"
      retries: 5
    restart: "unless-stopped"

  # 2. THE DUMPER SIDECAR (Creates the safe .sql backup file)
  odoo_backup:
    image: prodrigestivill/postgres-backup-local
    container_name: odoo_sql_dumper
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgresql_password
      - POSTGRES_EXTRA_OPTS=-Z9 --schema=public --blobs
      - SCHEDULE=@daily      # Runs once a day at midnight
      - BACKUP_KEEP_DAYS=7   # Cleans up local dumps older than 7 days
    volumes:
      # This folder will contain the .sql files for Duplicati to read
      - ./backups/odoo-db:/backups 
    secrets:
      - postgresql_password
    networks:
      - odoo-net

volumes:
  odoo-data:
  db-data:

secrets:
  postgresql_password:
    file: "./secrets/postgresql_password.txt"

networks:
  odoo-net:
    driver: "bridge"