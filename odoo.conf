[options]
; This is the Odoo configuration file for multi-database and domain matching
addons_path = /mnt/extra-addons
admin_passwd = your_secure_password
csv_internal_sep = ,
db_host = db
db_port = 5432
db_user = odoo
db_password = file:/run/secrets/postgresql_password
dbfilter = ^%d$
logfile = /var/log/odoo/odoo.log
proxy_mode = True
; You can add more options as needed
